# Modify:独立Rust工时应用及锁定的GPUI Kit、官方MCP SDK。$saving-ai-agent-tokens
[package]
name = "work-hours-record"
version = "2.0.0"
edition = "2024"
build = "build.rs"

[[bin]]
name = "WorkHoursRecord"
path = "src/main.rs"

[dependencies]
gpui-kit = "=0.9.0"
raw-window-handle = "0.6"
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "auth", "transport-streamable-http-client-reqwest"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-util = "0.7"
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.11"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm"] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"
axum = "0.8"
base64 = "0.22"
# Modify:仅打开Kit同一核心版本的离屏接口，不启用会引入另一后端的Kit全套测试功能。
gpui-test-core = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

